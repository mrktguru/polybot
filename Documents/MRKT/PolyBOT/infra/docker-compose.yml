services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: polybot
      POSTGRES_PASSWORD: polybot
      POSTGRES_DB: polybot
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polybot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../backend
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://polybot:polybot@db:5432/polybot
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../backend
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=INFO
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://polybot:polybot@db:5432/polybot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - api
      - redis

  beat:
    build:
      context: ../backend
    command: celery -A app.tasks.celery_app:celery_app beat --loglevel=INFO
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://polybot:polybot@db:5432/polybot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  frontend:
    build:
      context: ../frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db_data:
