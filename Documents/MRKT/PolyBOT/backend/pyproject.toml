[project]
name = "polybot"
version = "0.1.0"
description = "Polymarket algorithmic trading bot — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "redis>=5.2",
    "celery>=5.4",
    "httpx>=0.28",
    "structlog>=24.4",
    "numpy>=2.1",
    "websockets>=13.1",
    "python-multipart>=0.0.12",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: prefer enum.StrEnum — we intentionally use (str, Enum) for portability.
# B008: FastAPI's Depends() in defaults is the idiomatic pattern.
ignore = ["UP042", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
